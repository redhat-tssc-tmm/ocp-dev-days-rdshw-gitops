{{- $prefix := include "tpa-tenant.prefix" . -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tpa-short-url
  namespace: {{ $prefix }}-tpa
  labels:
    app: tpa
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  host: tpa-{{ $prefix }}.{{ .Values.cluster.subdomain }}
  to:
    kind: Service
    name: server
  port:
    targetPort: endpoint
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
