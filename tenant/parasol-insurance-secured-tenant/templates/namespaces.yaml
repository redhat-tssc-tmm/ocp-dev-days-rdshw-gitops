{{- $prefix := include "parasol-insurance-secured-tenant.prefix" . -}}
{{- range $ns := list "secured-build" "preprod" "secured-prod" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $prefix }}-{{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- if eq $ns "secured-prod" }}
  labels:
    policy.rhtas.com/include: "true"
{{- end }}
{{- end }}
