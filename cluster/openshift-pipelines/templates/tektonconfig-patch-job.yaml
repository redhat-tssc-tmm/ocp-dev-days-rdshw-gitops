# The Pipelines operator creates a TektonConfig CR with coschedule set to
# "workspaces" by default. This mode rejects any task that binds more than one
# PVC, which breaks tasks like sonar-scan that need both a source and a
# maven-cache workspace. This PostSync Job patches TektonConfig to use
# "pipelineruns" mode, which still handles node affinity across the pipeline
# run but allows individual tasks to mount multiple PVCs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tektonconfig-patch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tektonconfig-patch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: ["operator.tekton.dev"]
    resources: ["tektonconfigs"]
    verbs: ["get", "patch"]
  - apiGroups: ["operator.tekton.dev"]
    resources: ["tektoninstallersets"]
    verbs: ["get", "list", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tektonconfig-patch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tektonconfig-patch
subjects:
  - kind: ServiceAccount
    name: tektonconfig-patch
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tektonconfig-patch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: tektonconfig-patch
      containers:
        - name: patch
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "Waiting for TektonConfig to exist..."
              until oc get tektonconfig config > /dev/null 2>&1; do
                sleep 5
              done

              # Allow multiple PVCs per task pod. The default "workspaces" mode
              # rejects tasks that bind more than one PVC (e.g. sonar-scan with
              # source + maven-cache).
              oc patch tektonconfig config --type merge \
                -p '{"spec":{"pipeline":{"coschedule":"pipelineruns"}}}'
              echo "Pipeline config patched"

              # Configure Tekton Chains for keyless signing via TAS Fulcio/Rekor.
              # The Chains controller uses its projected SA token (audience:
              # trusted-artifact-signer) to obtain a short-lived signing cert
              # from Fulcio, and logs signatures to Rekor for transparency.
              FULCIO_URL="http://fulcio-server.trusted-artifact-signer.svc"
              REKOR_URL="http://rekor-server.trusted-artifact-signer.svc"

              oc patch tektonconfig config --type merge -p '{
                "spec": {
                  "chain": {
                    "signers.x509.fulcio.enabled": true,
                    "signers.x509.fulcio.address": "'"${FULCIO_URL}"'",
                    "signers.x509.fulcio.issuer": "https://kubernetes.default.svc",
                    "signers.x509.identity.token.file": "/var/run/sigstore/cosign/oidc-token",
                    "transparency.enabled": true,
                    "transparency.url": "'"${REKOR_URL}"'",
                    "artifacts.pipelinerun.format": "slsa/v2alpha4",
                    "artifacts.pipelinerun.storage": "oci",
                    "artifacts.taskrun.format": "slsa/v2alpha4",
                    "artifacts.taskrun.storage": "oci"
                  }
                }
              }'
              echo "Chains keyless signing configured"

              # Update the OIDC token audience on the Chains InstallerSet.
              # The operator hardcodes "sigstore" but TAS Fulcio requires
              # "trusted-artifact-signer" as the audience.
              echo "Patching Chains InstallerSet audience..."
              CHAIN_IS=$(oc get tektoninstallersets --no-headers | grep "^chain-" | grep -v "config\|secret" | awk '{print $1}')
              if [ -n "${CHAIN_IS}" ]; then
                oc get tektoninstallerset ${CHAIN_IS} -o json | \
                  python3 -c "
              import json, sys
              data = json.load(sys.stdin)
              for m in data['spec']['manifests']:
                  if m.get('kind') == 'Deployment':
                      for v in m['spec']['template']['spec']['volumes']:
                          if v.get('name') == 'oidc-info':
                              v['projected']['sources'][0]['serviceAccountToken']['audience'] = 'trusted-artifact-signer'
              json.dump(data, sys.stdout)
              " | oc replace -f - 2>/dev/null
                echo "Chains InstallerSet audience updated to trusted-artifact-signer"
              fi

              echo "TektonConfig patched"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
