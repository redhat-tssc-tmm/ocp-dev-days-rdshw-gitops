---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpa-db-monitor
  labels:
    app: tpa-db-monitor
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpa-db-monitor
  template:
    metadata:
      labels:
        app: tpa-db-monitor
    spec:
      containers:
        - name: db-monitor
          image: {{ .Values.image }}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: tpa-postgresql-credentials
                  key: db.host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: tpa-postgresql-credentials
                  key: db.port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: tpa-postgresql-credentials
                  key: db.name
            - name: DB_ADMIN
              valueFrom:
                secretKeyRef:
                  name: tpa-postgresql-credentials
                  key: db.admin
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tpa-postgresql-credentials
                  key: db.adminpassword
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
