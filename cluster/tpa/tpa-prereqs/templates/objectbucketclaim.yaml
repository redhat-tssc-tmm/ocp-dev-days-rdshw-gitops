apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: {{ .Values.objectBucketClaim.name }}
  namespace: {{ include "tpa-prereqs.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncwave.prereqs | quote }}
spec:
  bucketName: {{ .Values.objectBucketClaim.bucketName }}
  storageClassName: {{ .Values.objectBucketClaim.storageClassName }}
