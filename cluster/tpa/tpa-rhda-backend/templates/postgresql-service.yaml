---
apiVersion: v1
kind: Service
metadata:
  name: rhda-backend-postgresql
  namespace: {{ .Values.namespace }}
  labels:
    app: rhda-backend-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: rhda-backend-postgresql
