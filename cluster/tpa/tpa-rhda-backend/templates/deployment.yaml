---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhda-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: rhda-backend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhda-backend
  template:
    metadata:
      labels:
        app: rhda-backend
    spec:
      initContainers:
        - name: import-service-ca
          image: {{ .Values.initImage }}
          command: ['sh', '-c']
          args:
            - |
              cp /etc/pki/java/cacerts /tmp/truststore/cacerts
              chmod 644 /tmp/truststore/cacerts
              keytool -import -trustcacerts -noprompt \
                -keystore /tmp/truststore/cacerts \
                -storepass changeit \
                -alias openshift-service-ca \
                -file /tmp/service-ca/service-ca.crt
          volumeMounts:
            - name: service-ca-bundle
              mountPath: /tmp/service-ca
              readOnly: true
            - name: truststore
              mountPath: /tmp/truststore
      containers:
        - name: rhda-backend
          image: {{ .Values.image }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          resources:
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
          env:
            - name: DB_REDIS_HOST
              value: rhda-backend-redis
            - name: DB_REDIS_PORT
              value: "6379"
            - name: DB_POSTGRES_HOST
              value: rhda-backend-postgresql
            - name: DB_POSTGRES_PORT
              value: "5432"
            - name: DB_POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: rhda-backend-postgresql
                  key: database-name
            - name: DB_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rhda-backend-postgresql
                  key: database-user
            - name: DB_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rhda-backend-postgresql
                  key: database-password
            - name: DB_POSTGRES_SSLMODE
              value: disable
            - name: PROVIDER_RHTPA_HOST
              value: "https://server.{{ .Values.tpaNamespace }}.svc:443"
            - name: PROVIDER_RHTPA_AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: rhda-backend-secret
                  key: rhtpa.client.id
            - name: PROVIDER_RHTPA_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rhda-backend-secret
                  key: rhtpa.client.secret
            - name: PROVIDER_RHTPA_AUTH_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: rhda-backend-secret
                  key: rhtpa.auth.server.url
            - name: BRANDING_DISPLAY_NAME
              value: {{ .Values.branding.displayName | quote }}
            - name: BRANDING_EXPLORE_URL
              value: "https://tpa.{{ .Values.subdomain }}/search"
            - name: BRANDING_EXPLORE_TITLE
              value: {{ .Values.branding.exploreTitle | quote }}
            - name: BRANDING_EXPLORE_DESCRIPTION
              value: {{ .Values.branding.exploreDescription | quote }}
            - name: MONITORING_ENABLED
              value: "false"
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djavax.net.ssl.trustStore=/tmp/truststore/cacerts
                -Djavax.net.ssl.trustStorePassword=changeit
          volumeMounts:
            - name: truststore
              mountPath: /tmp/truststore
              readOnly: true
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: service-ca-bundle
          configMap:
            name: service-ca-bundle
        - name: truststore
          emptyDir: {}
