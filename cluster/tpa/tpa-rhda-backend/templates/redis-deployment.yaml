---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhda-backend-redis
  labels:
    app: rhda-backend-redis
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhda-backend-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rhda-backend-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            limits:
              memory: 256Mi
              cpu: 250m
            requests:
              memory: 128Mi
              cpu: 50m
          volumeMounts:
            - name: redis-data
              mountPath: /var/lib/redis/data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: rhda-backend-redis
