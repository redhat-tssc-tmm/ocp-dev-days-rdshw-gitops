---
apiVersion: v1
kind: Service
metadata:
  name: rhda-backend
  labels:
    app: rhda-backend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: management
      port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app: rhda-backend
