---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rhda-backend-postgresql
  namespace: {{ .Values.namespace }}
  labels:
    app: rhda-backend-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresql.storage }}
