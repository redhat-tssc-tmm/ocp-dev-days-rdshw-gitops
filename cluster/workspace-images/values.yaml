# Default values for workspace-images chart
nameOverride: ""
namespace: "workspace-images"

# ┌─────────────────────────────────────────────────────────────┐
# │ DEVELOPMENT FORK — change back before publishing:          │
# │   redhat-tssc-tmm → openshift-dev-days                     │
# │   module2 → main                                           │
# └─────────────────────────────────────────────────────────────┘
# Git repository configuration
git:
  # uri: "https://github.com/openshift-dev-days/workspace-images.git"
  uri: "https://github.com/redhat-tssc-tmm/workspace-images.git"
  # ref: "main"
  ref: "module2"
  contextDir: "cekit-builder-image"

# Image registry configuration
registry:
  hostname: "image-registry.openshift-image-registry.svc:5000"
  namespace: "workspace-images"
  # The builder image will be built and pushed here
  builderImage: "cekit-builder"
  builderTag: "latest"

# Resource limits for builds and tasks
resources:
  limits:
    cpu: "4"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "512Mi"

# Additional labels to add to all resources
labels: {}

# Annotations for ArgoCD sync-wave and hooks
annotations: {}