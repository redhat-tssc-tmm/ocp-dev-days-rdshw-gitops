apiVersion: batch/v1
kind: Job
metadata:
  name: wait-external-secrets-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: registry.access.redhat.com/ubi9-minimal:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for external-secrets webhook to be reachable..."
              until curl -sk -o /dev/null -w "%{http_code}" \
                "https://external-secrets-webhook.external-secrets.svc:443/healthz" 2>/dev/null \
                | grep -qE "^(200|404|405)"; do
                echo "  Webhook not ready, waiting 5s..."
                sleep 5
              done
              echo "External secrets webhook is reachable."
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
