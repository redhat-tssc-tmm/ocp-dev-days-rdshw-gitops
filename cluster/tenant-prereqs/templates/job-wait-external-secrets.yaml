apiVersion: batch/v1
kind: Job
metadata:
  name: wait-external-secrets-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: registry.access.redhat.com/ubi9-minimal:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for external-secrets webhook to accept requests..."
              until curl -sk --max-time 5 -o /dev/null -w "%{http_code}" \
                -X POST -H "Content-Type: application/json" -d "{}" \
                "https://external-secrets-webhook.external-secrets.svc:443/validate-external-secrets-io-v1beta1-externalsecret" \
                2>/dev/null | grep -q "200"; do
                echo "  Webhook not ready, waiting 5s..."
                sleep 5
              done
              echo "External secrets webhook is ready to accept requests."
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
