apiVersion: rhtas.charts.redhat.com/v1alpha1
kind: PolicyController
metadata:
  name: policy-controller
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  policy-controller:
    cosign:
      webhookName: "policy.rhtas.com"
    webhook:
      name: webhook
      extraArgs:
        webhook-name: policy.rhtas.com
        mutating-webhook-name: defaulting.clusterimagepolicy.rhtas.com
        validating-webhook-name: validating.clusterimagepolicy.rhtas.com
      env:
        KUBERNETES_MIN_VERSION: "1.29.0-0"
        DOCKER_CONFIG: "/home/nonroot/.docker"
      volumes:
        - name: registry-auth
          secret:
            secretName: registry-pull-secret
            items:
              - key: .dockerconfigjson
                path: config.json
      volumeMounts:
        - name: registry-auth
          mountPath: /home/nonroot/.docker
          readOnly: true
      failurePolicy: Fail
      namespaceSelector:
        matchExpressions:
          - key: policy.rhtas.com/include
            operator: In
            values: ["true"]
      webhookNames:
        defaulting: "defaulting.clusterimagepolicy.rhtas.com"
        validating: "validating.clusterimagepolicy.rhtas.com"
