{{- if .Values.rhtas.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.rhtas.name "namespace" .Values.argocd.namespace "syncWave" "1") }}
spec:
  destination:
    namespace: {{ .Values.rhtas.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: cluster/rhtas
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        rhtas-operator:
          subscription:
            source: {{ include "app-of-apps.operatorSource" . }}
        rhtas-instance:
          namespace: {{ .Values.rhtas.namespace }}
          instance: {{ .Values.rhtas.instance }}
          oidc:
            issuer: sso.{{ .Values.cluster.subdomain }}/realms/sso
          keycloak:
            host: sso.{{ .Values.cluster.subdomain }}
            realm: sso
          rootCert:
            email: {{ .Values.rhtas.rootCert.email }}
            org: {{ .Values.rhtas.rootCert.org }}
          vault:
            namespace: {{ .Values.vault.namespace }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
