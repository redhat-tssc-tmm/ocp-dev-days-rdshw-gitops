apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" "parasol-policy-controller" "namespace" .Values.argocd.namespace "syncWave" "4") }}
spec:
  destination:
    namespace: policy-controller-operator
    server: https://kubernetes.default.svc
  project: default
  source:
    path: cluster/parasol-policy-controller
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
