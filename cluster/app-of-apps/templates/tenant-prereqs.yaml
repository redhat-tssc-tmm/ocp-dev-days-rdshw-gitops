apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" "tenant-prereqs" "namespace" .Values.argocd.namespace "syncWave" "3") }}
spec:
  destination:
    namespace: {{ .Values.argocd.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: cluster/tenant-prereqs
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        keycloak:
          host: sso.{{ .Values.cluster.subdomain }}
          namespace: keycloak
          realm: sso
        tpa:
          oidc:
            clientId: tpa-cli
            frontendClientId: tpa-frontend
            clientSecret: {{ .Values.vault.secrets.tpa.clientSecret | quote }}
          adminEmail: admin@demo.redhat.com
  {{ include "app-of-apps.syncPolicy" . | nindent 2 }}
