gitops:
  repoURL: https://github.com/rhpds/ocp-dev-days-rdshw-gitops.git
  targetRevision: main

argocd:
  namespace: openshift-gitops

# Operator version pinning via custom CatalogSource.
# When enabled, a snapshot of the Red Hat operator catalog is deployed
# and all operator subscriptions use it instead of the live catalog.
catalogSource:
  enabled: true
  name: redhat-operators-snapshot
  namespace: openshift-marketplace
  image: quay.io/rhpds/olm_snapshot_redhat_catalog
  tag: v4.22_2026_08_03
  displayName: "Red Hat Operators (Snapshot)"
  publisher: "Red Hat Demo Platform"

cluster:
  subdomain: ""
  apiServer: ""

common:
  password: ""

vault:
  name: vault
  namespace: vault
  authNamespace: default
  secrets:
    gitlab:
      rootPassword: ""
    common:
      password: ""
    litellm:
      apiUrl: ""
      apiKey: ""
    sonarqube:
      adminPassword: ""
    kafka:
      userPassword: ""
    rhdh:
      argocdPassword: ""
    # DEV ONLY — in production, pass clientSecret from the automation repo
    rhacs:
      clientId: rhacs
      clientSecret: "00ifaFXkWfrNZwrqvzYZwyBhjkEWBzA6"
    # DEV ONLY — in production, pass clientSecret from the automation repo
    tpa:
      clientSecret: "SuTQThQk-68Lu-d7U1-R0co-ze2DBZ9EDPxP"

externalSecrets:
  name: external-secrets
  namespace: external-secrets

openshiftPipelines:
  name: openshift-pipelines
  namespace: openshift-pipelines

gitlab:
  name: gitlab
  namespace: gitlab
  host: ""
  smtp:
    host: ""
  ssh:
    host: ""
  rootPassword: ""
  usersPassword: ""
  cluster:
    subdomain: ""

quay:
  name: quay
  namespace: quay-registry
  host: ""
  adminUser: quayadmin
  adminUserPassword: ""
  organizations:
    - parasol
  users: []

devspaces:
  enabled: true
  name: devspaces
  namespace: openshift-devspaces

amqStreams:
  enabled: true
  name: amq-streams
  namespace: kafka

openvsx:
  name: openvsx
  namespace: che-openvsx

sonarqube:
  name: sonarqube
  namespace: sonarqube

workspaceImages:
  name: workspace-images
  namespace: workspace-images

clusterObservability:
  enabled: true

openshiftLightspeed:
  enabled: true
  name: openshift-lightspeed
  namespace: openshift-lightspeed

developerHub:
  name: developer-hub
  namespace: rhdh

rhacs:
  enabled: true
  name: rhacs
  namespace: rhacs
  operatorNamespace: rhacs-operator
  clusterName: local-secured-cluster

rhtas:
  enabled: true
  name: rhtas
  namespace: trusted-artifact-signer
  instance: securesign
  rootCert:
    email: admin@rhdemo.com
    org: Parasol

tpa:
  enabled: true
  name: tpa
  namespace: trusted-profile-analyzer
  rhdaNamespace: rhda-backend
  chartVersion: "*"
  images:
    dbMonitor: quay.io/tssc_demos/tpa-db-monitor:latest
    rhdaBackend: quay.io/tssc_demos/trustify-dependency-analytics:v3.1.0
    rhdaInitImage: registry.redhat.io/ubi9/openjdk-21-runtime:1.23
    postgresql: registry.redhat.io/rhel10/postgresql-18
    dataset: registry.redhat.io/ubi9/ubi
