apiVersion: batch/v1
kind: Job
metadata:
  name: rhacs-enable-console-plugin
  namespace: {{ include "rhacs-central.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: rhacs-setup
      restartPolicy: OnFailure
      containers:
        - name: enable-plugin
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              PLUGIN_NAME="advanced-cluster-security"

              CURRENT=$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}' 2>/dev/null || echo "[]")

              if echo "${CURRENT}" | grep -q "${PLUGIN_NAME}"; then
                echo "Console plugin '${PLUGIN_NAME}' already enabled."
                exit 0
              fi

              echo "Enabling console plugin '${PLUGIN_NAME}'..."
              oc patch console.operator.openshift.io cluster --type=json \
                -p="[{\"op\":\"add\",\"path\":\"/spec/plugins/-\",\"value\":\"${PLUGIN_NAME}\"}]"

              echo "Console plugin enabled."
